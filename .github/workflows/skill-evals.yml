name: Skill Evals

# Deterministic gates for the plugin's skills: Tier 1 lint (agentskills.io
# spec), Tier 1b security scan, Tier 2 trigger/routing evals, Tier 2b pytest
# structural tests. No model calls.

on:
  push:
  pull_request:

concurrency:
  group: skill-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tier 1 - skill lint (strict)
        run: |
          set -e
          for skill in skills/*/; do
            [ -f "$skill/SKILL.md" ] || continue
            python evals/tools/skill_lint.py "$skill" --strict
          done

      - name: Tier 1b - security scan
        run: python evals/tools/skill_scanner.py skills

      - name: Tier 1c - exact-line oracle gate
        run: python evals/tools/check_exact_line_oracles.py

      - name: Tier 2 - trigger and routing evals
        run: python evals/tools/run_trigger_evals.py

      - name: Tier 2b - structural pytest
        run: |
          python -m pip install --quiet pytest
          python -m pytest evals -q

  # The PowerShell scripts under test behave DIFFERENTLY on the two hosts
  # they support, and the difference is not cosmetic: `ConvertFrom-Json`
  # returns an ISO-8601 stamp as a String on Windows PowerShell 5.1 and
  # auto-converts it to a DateTime on PowerShell 7. 0.16.0 shipped a lane
  # lock that read every lock as unusable on pwsh - no exclusion at all -
  # while the author's local runs stayed green, because the suite picks
  # powershell.exe when both are installed. The ubuntu job above found it,
  # after release. This job is the other half: it runs the PowerShell-facing
  # tests under BOTH interpreters, so a 5.1-only regression cannot ship
  # either.
  powershell-hosts:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # EVERY dual-host module, not just the lock: the attestation scripts
      # are driven by the pre-push hook through powershell.exe and by a
      # pwsh-only machine through PowerShell 7, and the 0.17.0 probe and
      # mirror run from whichever host the driver happens to have, so they
      # all carry the same exposure. A green Windows suite proves ONE
      # interpreter - 0.16.1 shipped a lock that did not lock on pwsh for
      # exactly this reason. The hook tests are deliberately absent -
      # hooks.json invokes the hook as `pwsh`, so another host would not
      # match how it runs.
      #
      # The 0.24.0 tool-surface probe was added to BOTH lists as soon as it
      # existed, because leaving it out repeated the 0.16.0 shape exactly.
      # Its module skips wherever no host is found, so the ubuntu job runs
      # it under the pwsh that runner ships and windows-latest ran it under
      # nothing at all. That left Windows PowerShell 5.1 uncovered - and
      # 5.1 is the host the probe was BROKEN ON: 5.1 built the process's
      # stdin from Console.InputEncoding and put a byte-order mark on the
      # first JSON-RPC frame, so the app server rejected it. pwsh alone
      # would have passed that defect straight through.
      - name: PowerShell-facing tests under Windows PowerShell 5.1
        env:
          PARALLAX_PS_HOST: powershell.exe
        run: >
          python -m pytest
          evals/multi-model-verify/test_attestation.py
          evals/multi-model-verify/test_codex_context_probe.py
          evals/multi-model-verify/test_codex_tool_surface_probe.py
          evals/multi-model-verify/test_review_mirror.py
          evals/multi-model-verify/test_kimi_round_evidence.py
          evals/multi-model-verify/test_kimi_lane_lock.py
          evals/multi-model-verify/test_lock_protocol_live.py
          evals/multi-model-verify/test_kimi_credential_state.py
          evals/multi-model-verify/test_kimi_lane_login.py
          evals/multi-model-verify/test_kimi_lane_home.py
          evals/multi-model-verify/test_lane_credential_live_support.py -q

      - name: PowerShell-facing tests under PowerShell 7
        env:
          PARALLAX_PS_HOST: pwsh.exe
        run: >
          python -m pytest
          evals/multi-model-verify/test_attestation.py
          evals/multi-model-verify/test_codex_context_probe.py
          evals/multi-model-verify/test_codex_tool_surface_probe.py
          evals/multi-model-verify/test_review_mirror.py
          evals/multi-model-verify/test_kimi_round_evidence.py
          evals/multi-model-verify/test_kimi_lane_lock.py
          evals/multi-model-verify/test_lock_protocol_live.py
          evals/multi-model-verify/test_kimi_credential_state.py
          evals/multi-model-verify/test_kimi_lane_login.py
          evals/multi-model-verify/test_kimi_lane_home.py
          evals/multi-model-verify/test_lane_credential_live_support.py -q
