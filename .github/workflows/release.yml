name: Release

# One GitHub release per plugin version. The version string in
# `.claude-plugin/plugin.json` is the ONLY thing `claude plugin update`
# keys on (CLAUDE.md, "Dev loop"), so it is also the only thing a release
# should key on: when a push to main carries a version that has no
# `v<version>` tag yet, this tags the pushed head and publishes a release
# there with generated notes. A version that is already tagged is left
# alone, so a re-run cannot move a tag, and a push that touches the file
# without changing the version (a description edit, say) is a no-op.
#
# The tag lands on the MAIN head that carries the version, not on the
# branch commit that bumped it: the bump is made after the diff debate and
# arrives on main inside a merge commit, and the release should point at
# what a fresh install actually copies.
#
# `workflow_dispatch` exists so the first release can be cut by hand
# without a version bump, and so a missed one can be recovered.

on:
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json']
  workflow_dispatch:

# Two pushes in quick succession must not both try to create the same
# release; the second waits and then finds the tag already present.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the plugin version
        id: version
        run: |
          set -eu
          version="$(jq -r '.version' .claude-plugin/plugin.json)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::plugin.json version is not MAJOR.MINOR.PATCH: '$version'"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: existing
        run: |
          set -eu
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists at $(git rev-parse "$tag"); nothing to release"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # `gh release create` creates the tag at --target when it does not
      # exist, so there is no separate tag push. The previous tag, when
      # there is one, bounds the generated notes to this version's range.
      - name: Create the tag and release
        if: steps.existing.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          previous="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          notes="Plugin version $VERSION (\`.claude-plugin/plugin.json\` at $GITHUB_SHA)."
          if [ -n "$previous" ]; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "$notes" \
              --generate-notes \
              --notes-start-tag "$previous"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "$notes" \
              --generate-notes
          fi
          echo "::notice::released $TAG at $GITHUB_SHA (previous: ${previous:-none})"
